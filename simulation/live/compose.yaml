  b-203: {<<: *node, environment: {<<: *env, NODE_ID: B-203}}
  b-204: {<<: *node, environment: {<<: *env, NODE_ID: B-204}}
  b-301: {<<: *node, environment: {<<: *env, NODE_ID: B-301}}
